function tsValidate(rows,year){if(rows.length!==12)throw Error('Enter all 12 bonus months.');let seen=new Set();for(let i=0;i<12;i++){let [month,dates]=rows[i];if(month!==year+'-'+String(i+1).padStart(2,'0'))throw Error('Month '+(i+1)+' is missing.');if(dates.length<4||dates.length>5)throw Error('Each bonus month needs 4 or 5 Mondays.');for(const d of dates){let dt=dayDate(d);if(isNaN(dt)||iso(dt)!==d||dt.getDay()!==1)throw Error(d+' is not a valid Monday.');if(seen.has(d))throw Error('Monday '+d+' is repeated.');seen.add(d)}}return rows}
function tsEditor(){if(!tsDraft)return '';return `<div class="panel" style="margin-top:12px"><h3>Review ${tsDraft.year} bonus periods</h3><p class="ts-note">Check every Monday against the photo before saving. Each line is one bonus month; dates are Monday starts (YYYY-MM-DD), separated by commas.</p>${tsDraft.rows.map(([m,dates],i)=>`<label style="display:block;margin:10px 0"><strong>${new Date(Number(m.slice(0,4)),i,1).toLocaleDateString('en-GB',{month:'long'})}</strong><textarea class="ts-row" data-i="${i}" style="width:100%;min-height:52px;background:#101a24;color:#fff;border:1px solid #6baf82;border-radius:7px;padding:8px">${esc(dates.join(', '))}</textarea></label>`).join('')}<button class="btn" id="tsSave">Save checked timetable</button> <button class="btn secondary" id="tsCancel">Cancel</button></div>`}
function timesheetPanel(jobId){let saved=tsSchedules()[jobId]||{};return `<section class="panel" style="margin-top:14px;padding:14px"><h3>Annual bonus timetable</h3><p class="ts-note">Select the job, then upload a picture of its yearly bonus sheet. Recognition needs an internet connection and may make mistakes: review all dates before saving.</p><label>Bonus year <input id="tsYear" type="number" min="2020" max="2100" value="2027" style="width:95px;background:#101a24;color:white;padding:8px;border:1px solid #6baf82;border-radius:7px"></label><div style="margin-top:12px"><label class="btn secondary" style="display:inline-block;cursor:pointer">Upload / photograph sheet<input id="timesheetUpload" type="file" accept="image/*" style="display:none"></label> <button class="btn secondary" id="tsExample">Use 2027 sheet</button> <button class="btn secondary" id="tsManual">Manual input</button></div><p class="ts-note" id="timesheetStatus"></p><div id="timesheetPreview" style="margin-top:10px"></div><div id="tsSaved">${Object.keys(saved).sort().map(y=>`<div style="padding:9px;border-top:1px solid #36564f">${y}: ${saved[y].length} bonus months <button class="btn secondary ts-edit" data-year="${y}">Edit</button></div>`).join('')}</div><div id="tsEditor">${tsEditor()}</div></section>`}
function openTimesheetDB(){return new Promise((resolve,reject)=>{const r=indexedDB.open('bonus-tracker-timesheets',1);r.onupgradeneeded=()=>r.result.createObjectStore('photos');r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
async function saveTimesheetPhoto(file,year){const db=await openTimesheetDB();await new Promise((resolve,reject)=>{const t=db.transaction('photos','readwrite');t.objectStore('photos').put(file,(editJob||state.selected)+':'+year);t.oncomplete=resolve;t.onerror=()=>reject(t.error)});db.close()}
async function loadTimesheetPhoto(year){const id=(editJob||state.selected)+':'+year;const db=await openTimesheetDB();const blob=await new Promise((resolve,reject)=>{const r=db.transaction('photos').objectStore('photos').get(id);r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)});db.close();const el=document.getElementById('timesheetPreview');if(el){el.innerHTML='';if(blob){const url=URL.createObjectURL(blob);const img=document.createElement('img');img.alt='Saved annual bonus sheet';img.style='max-width:100%;border-radius:8px';img.src=url;img.onload=()=>URL.revokeObjectURL(url);el.appendChild(img)}}}
function tsSetDraft(year,rows){tsDraft={year,rows:rows.map(([m,d])=>[m,[...d]])};document.getElementById('tsEditor').innerHTML=tsEditor();tsBindEditor()}
function tsBindEditor(){document.getElementById('tsCancel')?.addEventListener('click',()=>{tsDraft=null;document.getElementById('tsEditor').innerHTML='' });document.getElementById('tsSave')?.addEventListener('click',()=>{try{const rows=tsDraft.rows.map(([m],i)=>[m,document.querySelector(`.ts-row[data-i="${i}"]`).value.split(/[\s,;]+/).map(x=>x.trim()).filter(Boolean)]);tsValidate(rows,tsDraft.year);tsSchedules()[editJob||state.selected]||={};tsSchedules()[editJob||state.selected][tsDraft.year]=rows;save();tsDraft=null;render()}catch(e){alert('Please check the dates: '+e.message)}})}

let manualSheet=null;
function tsMondayDates(year){const start=new Date(Number(year)-1,9,1),end=new Date(Number(year)+1,1,28),out=[];start.setDate(start.getDate()+(8-start.getDay())%7);for(let d=new Date(start);d<=end;d.setDate(d.getDate()+7))out.push(iso(d));return out}
function tsPrettyMonday(d){return dayDate(d).toLocaleDateString('en-GB',{weekday:'short',day:'2-digit',month:'short',year:'numeric'})}
function tsManualRows(){return Array.from({length:12},(_,i)=>[manualSheet.year+'-'+String(i+1).padStart(2,'0'),manualSheet.ranges[i]?.start&&manualSheet.ranges[i]?.end?manualSheet.mondays.filter(d=>d>=manualSheet.ranges[i].start&&d<=manualSheet.ranges[i].end):[]])}
function tsOpenManual(year,rows){let saved=rows||tsJobSchedules()[year]||tsDraft?.year===year&&tsDraft.rows||null;let ranges=Array.from({length:12},(_,i)=>{let dates=saved?.[i]?.[1]||[];return {start:dates[0]||'',end:dates[dates.length-1]||''}});manualSheet={year:String(year),ranges,mondays:tsMondayDates(year),active:null,phase:'start'};tsDrawManual()}
function tsCloseManual(){document.getElementById('tsManualOverlay')?.remove();manualSheet=null}
function tsDrawManual(){if(!manualSheet)return;let el=document.getElementById('tsManualOverlay');if(!el){el=document.createElement('div');el.id='tsManualOverlay';document.body.appendChild(el)}el.style.cssText='position:fixed;inset:0;z-index:99999;background:#08121c;color:#f2f7fc;overflow:auto;overscroll-behavior:contain;font-family:inherit';let y=manualSheet.year,active=manualSheet.active;el.innerHTML=`<div style="position:sticky;top:0;background:#101e2c;padding:15px;border-bottom:2px solid #168bff;z-index:1;display:flex;align-items:center;justify-content:space-between;gap:8px"><div><strong style="font-size:19px">${y} bonus timetable</strong><div style="font-size:13px;color:#a7bec9">Monday-start weeks</div></div><button class="btn secondary" id="tsManualClose">Close</button></div>${active===null?`<div style="padding:14px"><p style="color:#bbced6;margin:0 0 14px">Tap a bonus month to choose its first and last Monday.</p><div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px">${manualSheet.ranges.map((r,i)=>`<button type="button" class="tsMonthChoice" data-month="${i}" style="min-height:104px;text-align:left;background:#142330;border:1px solid #6baf82;border-radius:10px;color:white;padding:12px"><strong style="font-size:17px">${new Date(Number(y),i,1).toLocaleDateString('en-GB',{month:'long'})}</strong><div style="margin-top:9px;font-size:13px;color:#c6d6de">${r.start&&r.end?tsPrettyMonday(r.start)+' – '+tsPrettyMonday(r.end):'Not set'}</div></button>`).join('')}</div><button class="btn" id="tsManualSave" style="width:100%;margin-top:18px;padding:14px">Save annual timetable</button></div>`:`<div style="padding:14px"><button class="btn secondary" id="tsMonthBack">← All months</button><h2 style="margin:14px 0 4px">${new Date(Number(y),active,1).toLocaleDateString('en-GB',{month:'long'})} bonus</h2><p style="color:#bcd0da">${manualSheet.phase==='start'?'Select the FIRST Monday':'Select the LAST Monday'} of this bonus month.</p><div style="display:flex;gap:8px;margin-bottom:12px"><button class="btn secondary" id="tsPickStart" style="flex:1;${manualSheet.phase==='start'?'border:2px solid #168bff':''}">Start: ${manualSheet.ranges[active].start?tsPrettyMonday(manualSheet.ranges[active].start):'Select'}</button><button class="btn secondary" id="tsPickEnd" style="flex:1;${manualSheet.phase==='end'?'border:2px solid #168bff':''}">End: ${manualSheet.ranges[active].end?tsPrettyMonday(manualSheet.ranges[active].end):'Select'}</button></div><div id="tsMondayScroll" style="height:min(55vh,560px);overflow-y:auto;border:1px solid #426e5a;border-radius:10px">${manualSheet.mondays.filter(d=>manualSheet.phase==='start'||!manualSheet.ranges[active].start||d>=manualSheet.ranges[active].start).map(d=>{let r=manualSheet.ranges[active],within=r.start&&r.end&&d>=r.start&&d<=r.end,chosen=d===(manualSheet.phase==='start'?r.start:r.end);return `<button type="button" class="tsMondayChoice" data-date="${d}" style="display:block;width:100%;padding:14px 16px;text-align:left;border:0;border-bottom:1px solid #304452;color:white;background:${chosen?'#1765ad':within?'#193d34':'#111f2c'};font-size:16px">${tsPrettyMonday(d)}${chosen?' ✓':''}</button>`}).join('')}</div><p style="color:#bdd0d7;font-size:14px">${manualSheet.ranges[active].start&&manualSheet.ranges[active].end?tsManualRows()[active][1].length+' weeks selected: '+tsManualRows()[active][1].map(tsPrettyMonday).join(', '):'Select both dates to fill in the weeks automatically.'}</p><button class="btn" id="tsMonthDone" style="width:100%;padding:13px">Done</button></div>`}`;
el.querySelector('#tsManualClose').onclick=tsCloseManual;
el.querySelectorAll('.tsMonthChoice').forEach(b=>b.onclick=()=>{manualSheet.active=Number(b.dataset.month);manualSheet.phase='start';tsDrawManual()});
el.querySelector('#tsMonthBack')?.addEventListener('click',()=>{manualSheet.active=null;tsDrawManual()});
el.querySelector('#tsMonthDone')?.addEventListener('click',()=>{manualSheet.active=null;tsDrawManual()});
el.querySelector('#tsPickStart')?.addEventListener('click',()=>{manualSheet.phase='start';tsDrawManual()});
el.querySelector('#tsPickEnd')?.addEventListener('click',()=>{manualSheet.phase='end';tsDrawManual()});
el.querySelectorAll('.tsMondayChoice').forEach(b=>b.onclick=()=>{let r=manualSheet.ranges[manualSheet.active],d=b.dataset.date;if(manualSheet.phase==='start'){r.start=d;if(r.end&&r.end<d)r.end='';manualSheet.phase='end'}else{r.end=d;if(!r.start)r.start=d}tsDrawManual()});
el.querySelector('#tsManualSave')?.addEventListener('click',()=>{try{const rows=tsManualRows();tsValidate(rows,y);tsSchedules()[editJob||state.selected]||={};tsSchedules()[editJob||state.selected][y]=rows;save();tsCloseManual();render()}catch(e){alert('Cannot save yet: '+e.message)}});
}

function tsParseOCR(raw,year){let lines=raw.split(/\n/).map(x=>x.trim()).filter(Boolean),monthNames=['jan','feb','mar','apr','may','jun','jul','aug','sep','oct','nov','dec'];let rows=[];for(let i=0;i<12;i++){let idx=lines.findIndex(l=>new RegExp('\\b'+monthNames[i]+'[-\\s]*'+String(year).slice(-2)+'\\b','i').test(l));if(idx<0)throw Error('Could not identify all 12 month rows. Use the 2027 example or enter dates manually.');let line=lines.slice(idx,idx+2).join(' '),dates=[...line.matchAll(/\b(\d{1,2})\s*[-/]\s*(Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)\b/gi)].map(m=>{let mo=monthNames.indexOf(m[2].slice(0,3).toLowerCase());let yy=Number(year);if(i<=1&&mo>=10)yy--;return yy+'-'+String(mo+1).padStart(2,'0')+'-'+m[1].padStart(2,'0')});rows.push([year+'-'+String(i+1).padStart(2,'0'),dates])}return rows}
async function tsRecognize(file,year){let status=document.getElementById('timesheetStatus');status.textContent='Reading photo… this can take a minute.';if(!window.Tesseract){await new Promise((resolve,reject)=>{let script=document.createElement('script');script.src='https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';script.onload=resolve;script.onerror=()=>reject(Error('Photo recognition could not load. Check your internet connection.'));document.head.appendChild(script)})}const result=await Tesseract.recognize(file,'eng');const rows=tsParseOCR(result.data.text,year);tsSetDraft(year,rows);status.textContent='Dates detected. Review and correct all 12 months before saving.'}
function bindTimesheet(){const input=document.getElementById('timesheetUpload');if(!input)return;const yearInput=document.getElementById('tsYear'),year=()=>String(Number(yearInput.value)||2027);input.onchange=async()=>{const file=input.files?.[0];if(!file)return;const y=year();try{await saveTimesheetPhoto(file,y);await loadTimesheetPhoto(y);await tsRecognize(file,y)}catch(e){document.getElementById('timesheetStatus').textContent='Photo saved, but automatic reading failed: '+e.message+' You can still use the 2027 example or edit saved dates.'}};yearInput.onchange=()=>loadTimesheetPhoto(year()).catch(()=>{});document.getElementById('tsManual').onclick=()=>tsOpenManual(year());document.getElementById('tsExample').onclick=()=>{if(year()!=='2027'){alert('The supplied example is for 2027. Select 2027 first.');return}tsSetDraft('2027',TIMESHEET_2027)};document.querySelectorAll('.ts-edit').forEach(b=>b.onclick=()=>{const y=b.dataset.year;yearInput.value=y;tsOpenManual(y,tsJobSchedules()[y]);loadTimesheetPhoto(y).catch(()=>{})});tsBindEditor();loadTimesheetPhoto(year()).catch(()=>{})}
function settingsView(){
 if(themePage)return `<section class="panel settings-panel"><button type="button" class="btn secondary" id="themeBack">← Settings</button><h2>Themes</h2><p class="muted">Choose a theme. Your selection is saved on this device.</p><div class="theme-options">${[['blue','Dark Blue'],['green','Dark Green'],['light','Light Blue'],['grey','Dark Grey'],['orange','Black & Orange']].map(([id,name])=>`<button type="button" class="theme-option ${getTheme()===id?'chosen':''}" data-theme="${id}"><span class="theme-swatch swatch-${id}"></span>${name}</button>`).join('')}</div></section>`;
 return `<section class="panel settings-panel">
  <div class="settings-section"><h2>Appearance</h2><button type="button" class="settings-action" id="openThemes"><span>Themes</span><span aria-hidden="true">›</span></button></div>
  <div class="settings-section"><h2>Data backup</h2><p class="muted">Download a backup of all jobs, entries and bonus schedules. Keep this file somewhere safe.</p><button type="button" class="settings-action" id="backupDownload"><span>Download data</span><span aria-hidden="true">↓</span></button></div>
  <div class="settings-section"><h2>Import data</h2><p class="muted">Choose a historical import or Bonus Tracker backup (.json). Matching entry IDs are skipped. Existing entries are kept.</p><input type="file" id="backupUpload" accept=".json,application/json"><p id="importStatus" class="muted"></p><button type="button" class="settings-action" id="backupImport"><span>Upload data</span><span aria-hidden="true">↑</span></button></div>
  <div class="settings-section"><h2>Stored on this device</h2><p class="muted">${state.jobs.length} jobs · ${state.entries.length} entries. Data is saved in this browser, not your GitHub account. Download backups regularly.</p></div>
 </section>`

function backupDownload(){const backup={format:'bonus-tracker-backup-v1',exportedAt:new Date().toISOString(),jobs:state.jobs,entries:state.entries,selected:state.selected,timesheets:state.timesheets||{}};const blob=new Blob([JSON.stringify(backup,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='bonus-tracker-backup-'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
async function backupImport(){const file=document.getElementById('backupUpload')?.files?.[0],status=document.getElementById('importStatus');if(!file){alert('Choose a JSON file first.');return}try{const data=JSON.parse(await file.text());if(data.format!=='bonus-tracker-backup-v1'||!Array.isArray(data.jobs)||!Array.isArray(data.entries))throw Error('Not a valid Bonus Tracker backup/import file.');if(data.entries.some(e=>!e||typeof e.id!=='string'||typeof e.date!=='string'||!Number.isFinite(Number(e.duration))||Number(e.duration)<0))throw Error('Invalid entries in import file.');if(data.jobs.some(j=>!j||typeof j.id!=='string'||typeof j.name!=='string'))throw Error('Invalid jobs in import file.');const currentIds=new Set(state.entries.map(e=>String(e.id)));const jobIds=new Set(state.jobs.map(j=>j.id));const map=new Map();let jobsAdded=0,added=0;for(const job of data.jobs){const same=state.jobs.find(j=>j.id===job.id)||state.jobs.find(j=>j.name.trim().toLowerCase()===job.name.trim().toLowerCase());if(same){map.set(job.id,same.id)}else{const copy={...job};state.jobs.push(copy);jobIds.add(copy.id);map.set(job.id,copy.id);jobsAdded++}}for(const entry of data.entries){if(currentIds.has(entry.id))continue;const mapped=map.get(entry.jobId);if(!mapped)throw Error('Entry references a missing job: '+entry.jobId);state.entries.push({...entry,jobId:mapped});currentIds.add(entry.id);added++}if(data.timesheets&&typeof data.timesheets==='object'&&!Array.isArray(data.timesheets)){state.timesheets||={};for(const [jobId,years] of Object.entries(data.timesheets)){const target=map.get(jobId);if(!target||!years||typeof years!=='object'||Array.isArray(years))continue;state.timesheets[target]||={};for(const [year,months] of Object.entries(years)){if(!state.timesheets[target][year])state.timesheets[target][year]=months}}}try{save()}catch(e){throw Error('Browser storage is full. Download your data and free up space.')}status.textContent=`Imported ${added} entries and ${jobsAdded} jobs. Skipped ${data.entries.length-added} existing entries.`;alert(status.textContent);render()}catch(err){status.textContent='Import failed: '+err.message;alert(status.textContent)}}
function bindSettings(){document.getElementById('openThemes')?.addEventListener('click',()=>{themePage=true;render()});document.getElementById('themeBack')?.addEventListener('click',()=>{themePage=false;render()});document.querySelectorAll('.theme-option[data-theme]').forEach(b=>b.addEventListener('click',()=>{setTheme(b.dataset.theme);document.querySelectorAll('.theme-option').forEach(x=>x.classList.toggle('chosen',x.dataset.theme===getTheme()))}));document.getElementById('backupDownload')?.addEventListener('click',backupDownload);document.getElementById('backupImport')?.addEventListener('click',backupImport)}
function jobsView(){return `<div class="job-list-heading"><h2>Saved jobs</h2><button class="btn plus-job" data-action="openJob" aria-label="Add workplace" title="Add workplace">+</button></div><section class="panel">${state.jobs.length?state.jobs.map(x=>`<div class="job ${x.id===state.selected?'selected':''}" data-action="selectJob" data-id="${x.id}" role="button" tabindex="0" aria-label="Select ${esc(x.name)}"><div><strong>${esc(x.name)} ${x.id===state.selected?'<span class="pill">● Selected</span>':''}</strong></div><div class="actions"><button class="btn secondary job-action-btn" data-action="editJob" data-id="${x.id}">Edit</button><button class="btn danger job-action-btn" data-action="deleteJob" data-id="${x.id}">Delete</button></div></div>`).join(''):'<div class="empty">Tap + to add a job.</div>'}</section>`}
function clock(h){let m=Math.round(n(h)*60);return String(Math.floor(m/60)%24).padStart(2,'0')+':'+String(m%60).padStart(2,'0')}
function clockHours(v){let m=/^(\d{2}):(\d{2})$/.exec(v||'');return m?Number(m[1])+Number(m[2])/60:null}
function entryFormView(){let e=state.entries.find(x=>x.id===editEntry),date=e?.date||iso(new Date()),jid=e?.jobId||state.selected;let previous=sortEntries(state.entries.filter(x=>x.date===date&&x.jobId===jid&&x.id!==e?.id));let start=e?.start??(previous.length?Math.max(...previous.map(x=>n(x.start)+n(x.duration))):0);let duration=e?.duration||0;return `<div class="modal-backdrop" id="entryBackdrop"><section class="modal-box" role="dialog" aria-modal="true"><div class="modal-top"><h2>${e?'Edit entry':'Add entry'}</h2><button type="button" class="icon" data-action="closeEntry" aria-label="Close">×</button></div><form id="entryForm"><label>Date</label><input type="date" name="date" required value="${date}"><div class="grid"><div><label>Start</label><input type="time" name="start" required value="${clock(start)}"></div><div><label>Finish</label><input type="time" name="finish" required value="${clock(start+duration)}"></div></div><label>Hours</label><input name="duration" inputmode="decimal" required placeholder="1.27" value="${e?e.duration.toFixed(2):''}"><label>Comment</label><textarea name="comment" rows="3" placeholder="Notes">${esc(e?.comment)}</textarea><div class="actions"><button class="btn" type="submit">${e?'Save':'Add entry'}</button><button class="btn secondary" type="button" data-action="closeEntry">Cancel</button></div></form></section></div>`}
function shortDate(d){return String(d.getDate()).padStart(2,"0")+"/"+String(d.getMonth()+1).padStart(2,"0")};function hoursMinutes(h){let m=Math.round(n(h)*60);return Math.floor(m/60)+"h "+String(m%60).padStart(2,"0")+"m"};
function entriesView(){

 const groups={};for(const e of filtered){const k=iso(weekStart(dayDate(e.date)));(groups[k]??=[]).push(e)}

}
function entryBonusRate(e,job){return n(e.bonusRateSnapshot??job?.bonusRate)}
function weekPay(entries,job){if(!job)return 0;let total=entries.reduce((v,e)=>v+n(e.duration),0);if(!total)return 0;const eligible=Math.max(0,total-n(job.threshold));return eligible*entries.reduce((sum,e)=>sum+n(e.duration)*entryBonusRate(e,job),0)/total}
function bonusMonthForWeek(jobId,wk){const years=state.timesheets?.[jobId]||{};for(const rows of Object.values(years))for(const [month,dates] of rows)if(dates.includes(wk))return month;return wk.slice(0,7)}
function bonusView(){
 const job=selected();if(!job)return '<div class="empty">Select a job in Jobs.</div>';
 const entries=state.entries.filter(e=>e.jobId===job.id),weeks={};
 for(const e of entries){const wk=iso(weekStart(dayDate(e.date)));(weeks[wk]??=[]).push(e)}
 const months={};for(const wk of Object.keys(weeks)){const month=bonusMonthForWeek(job.id,wk);(months[month]??=[]).push(wk)}
 const keys=Object.keys(months).sort().reverse();
 const bonusHours=g=>Math.max(0,g.reduce((s,e)=>s+n(e.duration),0)-n(job.threshold));
 const totalBonusHours=Object.values(weeks).reduce((s,g)=>s+bonusHours(g),0);
 const totalBonus=Object.values(weeks).reduce((s,g)=>s+weekPay(g,job),0);
 let out=`<div class="entry-toolbar"><strong>${esc(job.name)}</strong></div><section class="entry-overview"><span>Total bonus</span><b>${hoursMinutes(totalBonusHours)}</b><b>${money(totalBonus)}</b></section>`;
 if(!keys.length)return out+'<div class="empty">No entries yet.</div>';
 return out+keys.map(month=>{
   const wks=months[month].slice().sort().reverse();
   const h=wks.reduce((s,k)=>s+bonusHours(weeks[k]),0);
   const pay=wks.reduce((s,k)=>s+weekPay(weeks[k],job),0);
   const opened=expandedMonths.has(month);
   const label=new Date(Number(month.slice(0,4)),Number(month.slice(5,7))-1,1).toLocaleDateString('en-GB',{month:'long',year:'numeric'}).toUpperCase();
   return `<section class="week-group" data-month="${month}" data-action="toggleMonth" data-id="${month}" role="button" tabindex="0"><div class="week-header"><span>${label}</span></div><div class="week-total"><span>Bonus</span><span class="bonus-month-values"><strong>${hoursMinutes(h)}</strong><strong>${money(pay)}</strong></span></div>${opened?wks.map(k=>{const wh=weeks[k].reduce((s,e)=>s+n(e.duration),0),bh=bonusHours(weeks[k]);return `<button type="button" class="bonus-week-link" data-action="openBonusWeek" data-id="${k}"><span>Week of ${dayDate(k).toLocaleDateString('en-GB',{day:'numeric',month:'short'})}<small>Total: ${hoursMinutes(wh)}</small></span><span class="bonus-week-values"><strong>${hoursMinutes(bh)}</strong><strong>${money(weekPay(weeks[k],job))}</strong></span><span class="bonus-chevron">›</span></button>`}).join(''):''}</section>`;
 }).join('');
}

function entryActionsView(){const e=state.entries.find(x=>x.id===entryActions);if(!e)return '';return `<div class="modal-backdrop" id="entryActionBackdrop"><section class="modal-box" role="dialog" aria-modal="true"><div class="modal-top"><h2>Entry options</h2><button class="icon" data-action="closeEntryActions">×</button></div><p>${dayDate(e.date).toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'})} · ${hoursMinutes(e.duration)}</p><div class="actions"><button class="btn" data-action="editSelectedEntry">Edit</button><button class="btn danger" data-action="deleteSelectedEntry">Delete</button></div></section></div>`}
function recalcDay(date,jobId){let a=sortEntries(state.entries.filter(e=>e.date===date&&e.jobId===jobId));let pos=a.length?n(a[0].start):0;for(let e of a){e.start=pos;pos+=e.duration}}
function bind(){if(tab==='jobs')document.querySelectorAll('.job[data-action="selectJob"]').forEach(el=>el.onkeydown=e=>{if(e.target!==el)return;if(e.key==='Enter'||e.key===' '){e.preventDefault();el.click()}});if(tab==='settings')bindSettings();else if(tab==='jobs')bindTimesheet();document.querySelectorAll('[data-action]').forEach(b=>b.onclick=(ev)=>{ev.stopPropagation();let a=b.dataset.action,id=b.dataset.id;if(a==='entryOptions'){if(suppressEntryClick){suppressEntryClick=false;return}if(selectedEntryIds.size){selectedEntryIds.has(id)?selectedEntryIds.delete(id):selectedEntryIds.add(id)}else{editEntry=id;entryActions=null;entryModal=true}}if(a==='cancelEntrySelection'){selectedEntryIds.clear()}if(a==='deleteSelectedEntries'){if(!selectedEntryIds.size)return;if(!confirm('Delete '+selectedEntryIds.size+' selected entr'+(selectedEntryIds.size===1?'y':'ies')+'?'))return;const removed=state.entries.filter(e=>selectedEntryIds.has(e.id));state.entries=state.entries.filter(e=>!selectedEntryIds.has(e.id));for(const e of removed){recalcDay(e.date,e.jobId)}selectedEntryIds.clear();save()}if(a==='closeEntryActions'){entryActions=null}if(a==='editSelectedEntry'){editEntry=entryActions;entryActions=null;entryModal=true}if(a==='deleteSelectedEntry'){if(!confirm('Delete this entry?'))return;const e=state.entries.find(x=>x.id===entryActions);if(e){state.entries=state.entries.filter(x=>x.id!==entryActions);recalcDay(e.date,e.jobId);save()}entryActions=null}if(a==='selectJob'){state.selected=id;entryPage={level:"weeks",week:null,day:null};expandedWeeks.clear();expandedDays.clear();expandedMonths.clear();save()}if(a==='openJob'){editJob=null;jobModal=true}if(a==='editJob'){editJob=id;jobModal=true}if(a==='closeJob'){editJob=null;jobModal=false}if(a==='cancelJob'){editJob=null;jobModal=false};if(a==='deleteJob'){if(!confirm('Delete this workplace and all its entries?'))return;state.jobs=state.jobs.filter(j=>j.id!==id);state.entries=state.entries.filter(e=>e.jobId!==id);if(state.selected===id)state.selected=state.jobs[0]?.id||null;editJob=null;save()}if(a==='openEntry'){editEntry=null;entryModal=true}if(a==='closeEntry'){editEntry=null;entryModal=false}if(a==='editEntry'){editEntry=id;entryModal=true;tab='entries'}if(a==='cancelEntry')editEntry=null;if(a==='deleteEntry'){if(!confirm('Delete this entry?'))return;let e=state.entries.find(e=>e.id===id);state.entries=state.entries.filter(e=>e.id!==id);recalcDay(e.date,e.jobId);save()}if(a==='openWeek'){selectedEntryIds.clear();weekOrigin='entries';entryPage={level:'week',week:id,day:null};window.scrollTo(0,0)}if(a==='openDay'){entryPage={level:'day',week:entryPage.week,day:id}}if(a==='entryBack'){selectedEntryIds.clear();entryPage={level:'weeks',week:null,day:null};tab=weekOrigin;window.scrollTo(0,0)}if(a==='toggleMonth'){if(expandedMonths.has(id))expandedMonths.clear();else{expandedMonths.clear();expandedMonths.add(id)}}if(a==='openBonusWeek'){selectedEntryIds.clear();weekOrigin='bonus';tab='entries';entryPage={level:'week',week:id,day:null};window.scrollTo(0,0)}if(a==='toggleWeek'){expandedWeeks.has(id)?expandedWeeks.delete(id):expandedWeeks.add(id)}if(a==='toggleDay'){expandedDays.has(id)?expandedDays.delete(id):expandedDays.add(id)}if(a==='prevWeek')weekOffset--;if(a==='nextWeek')weekOffset++;if(a==='todayWeek')weekOffset=0;render()});if(tab==='entries'&&entryPage.level==='week')document.querySelectorAll('.week-entry[data-id]').forEach(el=>{let timer=null,origin=null,held=false;const clear=()=>{if(timer!==null){clearTimeout(timer);timer=null}};el.addEventListener('pointerdown',ev=>{if(ev.button!==0)return;held=false;origin={x:ev.clientX,y:ev.clientY};clear();timer=setTimeout(()=>{timer=null;held=true;const id=el.dataset.id;selectedEntryIds.has(id)?selectedEntryIds.delete(id):selectedEntryIds.add(id);suppressEntryClick=true;render()},550)});el.addEventListener('pointermove',ev=>{if(origin&&Math.hypot(ev.clientX-origin.x,ev.clientY-origin.y)>12)clear()});el.addEventListener('pointerup',clear);el.addEventListener('pointercancel',clear);el.addEventListener('contextmenu',ev=>{ev.preventDefault()})});
$('#jobForm')?.addEventListener('submit' ,ev=>{ev.preventDefault();let f=new FormData(ev.target),threshold=Number(f.get('threshold'));if(!Number.isFinite(threshold)||threshold<0){alert('Enter a valid threshold');return}let x={id:editJob||uid(),name:String(f.get('name')).trim(),hourly:n(f.get('hourly')),bonusRate:n(f.get('bonusRate')),base:n(f.get('base')),threshold:String(f.get('threshold'))};if(editJob){const oldJob=state.jobs.find(j=>j.id===editJob);if(oldJob&&(n(oldJob.hourly)!==x.hourly||n(oldJob.bonusRate)!==x.bonusRate)){const choice=prompt('Rates changed. Type ALL to update existing entries, NEW to keep old rates on existing entries, or CANCEL to stop.','NEW');if(choice===null||choice.trim().toUpperCase()==='CANCEL')return;const mode=choice.trim().toUpperCase();if(!['ALL','NEW'].includes(mode)){alert('Enter ALL or NEW.');return}for(const e of state.entries.filter(e=>e.jobId===editJob)){if(mode==='ALL'){e.hourlyRateSnapshot=x.hourly;e.bonusRateSnapshot=x.bonusRate}else{if(e.hourlyRateSnapshot==null)e.hourlyRateSnapshot=n(oldJob.hourly);if(e.bonusRateSnapshot==null)e.bonusRateSnapshot=n(oldJob.bonusRate)}}}state.jobs=state.jobs.map(j=>j.id===editJob?x:j)}else state.jobs.push(x);state.selected=x.id;editJob=null;jobModal=false;save();render()});$('#entryForm')?.addEventListener('submit',ev=>{ev.preventDefault();let f=new FormData(ev.target),raw=String(f.get('duration')).trim(),duration=/^\d+(\.\d+)?$/.test(raw)?Math.round(Number(raw)*60)/60:null;if(duration===null||duration<=0){alert('Enter decimal hours, e.g. 1.27 or 1.50.');return}let startTime=clockHours(String(f.get('start'))),finishTime=clockHours(String(f.get('finish')));if(startTime===null||finishTime===null){alert('Enter start and finish times');return}let old=state.entries.find(e=>e.id===editEntry),x={id:editEntry||uid(),jobId:old?.jobId||state.selected,date:String(f.get('date')),start:startTime,duration,hourlyRateSnapshot:old?.hourlyRateSnapshot??n(selected()?.hourly),bonusRateSnapshot:old?.bonusRateSnapshot??n(selected()?.bonusRate),comment:String(f.get('comment')),order:old?.order??Date.now()};if(editEntry)state.entries=state.entries.map(e=>e.id===editEntry?x:e);else state.entries.push(x);if(old)recalcDay(old.date,old.jobId);recalcDay(x.date,x.jobId);state.selected=x.jobId;editEntry=null;entryModal=false;save();render()})}
