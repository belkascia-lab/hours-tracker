// Swipe between main tabs, without interfering with vertical scrolling or dialogs.
(()=>{
 const area=document, content=document.getElementById('content'), order=['jobs','entries','bonus'];
 let start=null, suppressUntil=0;
 const blocked=()=>!order.includes(tab)||(tab==='entries'&&entryPage.level!=='weeks')||searchOpen||entryModal||jobModal||entryActions||selectedEntryIds.size||document.querySelector('.modal-backdrop,[aria-modal="true"]');
 area.addEventListener('touchstart',e=>{
  start=null;
  if(blocked()||e.touches.length!==1||e.target.closest('input,textarea,select,[contenteditable],a'))return;
  if(e.touches[0].clientY<document.querySelector('.tabs').getBoundingClientRect().bottom)return;
  const t=e.touches[0]; start={x:t.clientX,y:t.clientY,id:t.identifier,tab,at:Date.now()};
 },{passive:true});
 area.addEventListener('touchmove',e=>{if(!start)return;if(e.touches.length!==1){start=null;return;}const t=e.touches[0];if(Math.abs(t.clientY-start.y)>35&&Math.abs(t.clientY-start.y)>Math.abs(t.clientX-start.x))start=null;},{passive:true});
 area.addEventListener('touchcancel',()=>{start=null;},{passive:true});
 area.addEventListener('touchend',e=>{
  const a=start;start=null;if(!a||blocked()||tab!==a.tab||Date.now()-a.at>650)return;
  const t=Array.from(e.changedTouches).find(t=>t.identifier===a.id);if(!t)return;
  const dx=t.clientX-a.x,dy=t.clientY-a.y;if(Math.abs(dx)<70||Math.abs(dx)<1.7*Math.abs(dy))return;
  const next=order[order.indexOf(tab)+(dx<0?1:-1)];if(!next)return;
  if(e.cancelable)e.preventDefault();
  document.querySelector('.tab[data-tab="'+next+'"]').click();
  suppressUntil=Date.now()+350;
 },{passive:false});
 area.addEventListener('click',e=>{if(e.isTrusted&&Date.now()<suppressUntil){e.preventDefault();e.stopImmediatePropagation();}},true);
})();
